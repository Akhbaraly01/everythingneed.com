name: Module Boundaries

# Guards the modular monolith:
#   - ModularMonolithTest: no literal DB::table('...') cross-module reads in
#     Modules/** (Core/ and app/ are exempt)
#   - FrontendPolicyTest: no native prompt/confirm dialogs, design-token
#     footer rules (single Inertia app)
#   - AdminAuthorizationMatrixTest: admin nav <-> web route parity
#
# (The previous revision of this workflow targeted the retired src/ SPA
# architecture - scripts/check-module-structure.mjs and
# check-event-contracts.mjs - whose directory no longer exists.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  architecture:
    name: Architecture gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: everythingneed_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # 8.5 matches the dev box; symfony/* v8.1 requires php >=8.4.1.
          php-version: "8.5"
          extensions: pgsql, mbstring, dom, fileinfo, curl, tokenizer, ctype, openssl
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Architecture + authorization matrix gates
        working-directory: backend
        run: >-
          php artisan test
          tests/Feature/Architecture
          tests/Feature/Admin/AdminAuthorizationMatrixTest.php
          --no-coverage

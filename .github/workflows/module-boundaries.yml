name: Module Boundaries

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eslint-module-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Module structure (three-layer convention)
        run: node scripts/check-module-structure.mjs
      - name: Event/contract typing parity
        run: node scripts/check-event-contracts.mjs
      - name: API/contracts/validators usage (modules)
        run: node scripts/check-api-usage.mjs
      - name: Lint module boundaries (src/modules/**)
        run: bunx eslint "src/modules/**/*.{ts,tsx}" --max-warnings=0
      - name: Full ESLint pass
        run: bunx eslint .
      - name: Core unit tests (security + engines)
        run: bunx vitest run src/core/security src/core/engines --coverage --coverage.thresholds.statements=90 --coverage.thresholds.branches=85 --coverage.include='src/core/security/**' --coverage.include='src/core/engines/**'

  e2e-routing-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E suite
        run: bunx playwright test --project=chromium
      - name: Enforce coverage threshold
        env:
          E2E_MIN_TESTS: "5"
        run: node scripts/check-e2e-results.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

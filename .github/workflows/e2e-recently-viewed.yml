name: E2E — Recently Viewed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  recently-viewed-e2e:
    name: Playwright (Recently Viewed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Recently Viewed E2E (all browsers)
        run: npx playwright test e2e/recently-viewed.spec.ts --reporter=list
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
